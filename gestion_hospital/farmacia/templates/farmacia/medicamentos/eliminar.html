{% extends 'farmacia/layout.html' %}

{% block renderizado %}
<h2>Eliminar medicamento</h2>

<p class="mensaje">
    ¿Seguro que desea eliminar <strong>{{ medicamento.nombre_generico }}</strong>
    ({{ medicamento.concentracion }}), lote <strong>{{ medicamento.lote }}</strong>?
</p>

<form method="post">
    {% csrf_token %}
    <button class="boton boton-rojo" type="submit">Sí, eliminar</button>
    <a class="boton boton-gris" href="{% url 'farmacia:medicamentos' %}">Cancelar</a>
</form>
{% endblock %}
