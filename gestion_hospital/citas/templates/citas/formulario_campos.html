{{ formulario.non_field_errors }}
{% for campo in formulario %}
    {% if campo.is_hidden %}
        {{ campo }}{{ campo.errors }}
    {% else %}
        <div class="campo">
            {{ campo.label_tag }}
            {{ campo }}
            {% if campo.help_text %}<p class="ayuda">{{ campo.help_text }}</p>{% endif %}
            {{ campo.errors }}
        </div>
    {% endif %}
{% endfor %}
